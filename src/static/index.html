<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Detect Studio — Multi-Profile Browser Manager</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-nav">
      <div class="nav-brand"><h2>Anti-Detect Studio</h2></div>
      <div class="nav-controls">
        <input type="text" id="searchInput" placeholder="Search profiles, channels, UA...">
        <button class="btn-donate" id="btnDonate">Donate</button>
        <button class="btn-secondary" id="btnGithubAccounts">GitHub Accounts</button>
        <button class="btn-primary" id="btnNewProfile">Create Profile</button>
      </div>
    </header>
    <div class="toolbar">
      <div class="filter-pills">
        <button class="pill active" data-filter="all">All (<span id="countAll">0</span>)</button>
        <button class="pill" data-filter="running">Running (<span id="countRunning">0</span>)</button>
        <button class="pill" data-filter="mobile">Mobile Devices (<span id="countMobile">0</span>)</button>
        <button class="pill" data-filter="github">GitHub Cloud IP (<span id="countGithub">0</span>)</button>
      </div>
      <div class="toolbar-stats">
        <button id="btnSwitchAllDirect">All Direct</button>
        <button id="btnAutoUpdateToggle">Auto-Update: <span id="autoUpdateState">ON</span></button>
        <select id="clientFilter" title="Filter by client"><option value="">All clients</option></select>
        <button id="btnBulkLaunch" title="Launch selected via job queue">Launch selected</button>
        <button id="btnBulkStop" title="Stop selected via job queue">Stop selected</button>
        <input id="apiTokenInput" type="password" placeholder="API token" title="Saved to localStorage as mp_api_token">
        <span id="healthVersionBadge"><span id="healthVersionText">System Online</span></span>
      </div>
    </div>
    <main class="main-content">
      <div id="updateNoticeBar" style="display:none"></div>
      <div id="adBannerContainer" style="display:none"></div>
      <div class="profiles-grid" id="profilesGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <h3>No profiles found</h3>
        <button class="btn-primary" id="btnEmptyCreate">+ Create Profile</button>
      </div>
    </main>
  </div>
  <div class="modal-overlay" id="profileModal" style="display:none">
    <div class="modal-card">
      <div class="modal-header"><h3 id="modalTitle">Create New Profile</h3><button class="modal-close" id="modalCloseBtn">&times;</button></div>
      <form id="profileForm" class="modal-body">
        <input type="hidden" id="formProfileId">
        <input type="text" id="formName" required>
        <input type="color" id="formColor" value="#0ea5e9">
        <input type="text" id="formNotes">
        <select id="formUserAgentSelect" required></select>
        <div id="formCustomUaGroup" style="display:none"><textarea id="formCustomUaInput"></textarea></div>
        <input type="radio" name="proxyType" value="github" checked>
        <input type="radio" name="proxyType" value="custom">
        <input type="radio" name="proxyType" value="none">
        <select id="formGithubAccountSelect"></select>
        <div id="formCustomProxyGroup" style="display:none">
          <input id="formProxyQuickPaste"><button type="button" id="btnAutoFillProxy">Auto-Fill</button>
          <select id="formProxyProtocol"><option value="socks5" selected>SOCKS5</option></select>
          <input id="formProxyHost"><input id="formProxyPort" type="number">
          <input id="formProxyUser"><input id="formProxyPass" type="password">
          <input type="hidden" id="formCustomProxy">
          <button type="button" id="btnTestProxyConn"><span id="btnTestProxyText">Test</span></button>
          <span id="proxyTestStatusBadge"></span>
          <div id="proxyDiagnosticCard" style="display:none"><div id="proxyDiagContent"></div>
          <button type="button" id="btnApplyProxyTimezone" style="display:none">TZ</button></div>
        </div>
        <select id="formTimezone"><option value="America/New_York" selected>US Eastern</option></select>
        <input id="formLanguage" value="en-US">
        <select id="formWebrtcMode"><option value="default" selected>Default</option></select>
        <input id="formSeed" type="number">
        <button type="button" id="btnShowFingerprint">Fingerprint</button>
        <input type="url" id="formStartUrl" value="https://studio.youtube.com">
        <input type="checkbox" id="formAutoLaunch" checked>
        <button type="button" id="btnCancelModal">Cancel</button>
        <button type="submit" id="btnSaveProfile">Save Profile</button>
      </form>
    </div>
  </div>
  <div class="modal-overlay" id="githubModal" style="display:none">
    <button class="modal-close" id="githubModalCloseBtn">&times;</button>
    <div id="githubAccountsList"></div>
    <form id="addGhAccountForm">
      <input type="password" id="ghTokenInput" required>
      <input type="text" id="ghLabelInput">
      <input type="checkbox" id="ghIsDefaultInput">
      <button type="submit" id="btnSubmitGhAccount">Connect</button>
    </form>
    <button type="button" id="btnCopyGhLink">Copy Link</button>
    <a id="btnOpenGhLink" href="https://github.com/settings/tokens/new">Open</a>
    <button type="button" id="btnOpenGhModalFromForm">Add</button>
    <button type="button" id="btnFormRandomUa">Randomize</button>
  </div>
  <div class="modal-overlay" id="adPopupModal" style="display:none">
    <button class="modal-close" id="adPopupCloseBtn">&times;</button>
    <span id="adPopupBadge"></span><div id="adPopupIcon"></div>
    <h3 id="adPopupTitle"></h3><p id="adPopupMessage"></p>
    <a id="adPopupBtn"><span id="adPopupBtnText"></span></a>
    <button type="button" id="adPopupDismissBtn">Dismiss</button>
  </div>
  <div class="modal-overlay" id="mandatoryUpdateModal" style="display:none">
    <h3 id="mandatoryTitle"></h3><p id="mandatoryDesc"></p>
    <div id="mandatoryChangelog"></div>
    <div id="updateInstallProgress" hidden>
      <div id="updateProgressFill"></div>
      <div id="updateProgressText"></div>
    </div>
    <button type="button" id="mandatoryUpdateBtn"><span id="mandatoryBtnText"></span></button>
  </div>
  <div class="modal-overlay" id="donateModal" style="display:none">
    <h3 id="donateModalTitle"></h3><p id="donateModalSubtitle"></p>
    <button id="btnToggleDonateEdit" type="button"><span id="btnToggleDonateEditText">Edit</span></button>
    <button class="modal-close" id="btnDonateClose">&times;</button>
    <div id="donateViewSection">
      <button class="donate-tab-btn active" data-tab="crypto" id="tabBtnCrypto">Crypto</button>
      <button class="donate-tab-btn" data-tab="custom" id="tabBtnCustom">Coffee</button>
      <div id="donateTabCrypto"><div id="donateCardUsdtTrc"><div id="donateUsdtTrcText"></div><button id="btnCopyUsdtTrc" type="button">Copy</button></div>
      <div id="donateCardUsdtBep"><div id="donateUsdtBepText"></div><button id="btnCopyUsdtBep" type="button">Copy</button></div>
      <div id="donateCryptoEmpty" style="display:none"></div></div>
      <div id="donateTabCustom" style="display:none"><p id="donateCustomNote"></p><a id="donateCoffeeLink" href="#">Coffee</a></div>
    </div>
    <div id="donateEditSection" style="display:none">
      <input id="editDonationTitle"><input id="editDonationSubtitle">
      <input id="editDonationUsdtBep"><input id="editDonationUsdtTrc"><input id="editDonationCoffee">
      <input type="checkbox" id="editShowUsdtTrc" checked>
      <input type="checkbox" id="editShowUsdtBep" checked>
      <input type="checkbox" id="editShowCoffee" checked>
      <textarea id="editDonationNote"></textarea>
      <span id="donateEditMsg"></span>
      <button type="button" id="btnCancelDonationEdit">Cancel</button>
      <button type="button" id="btnSaveDonationEdit">Save</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
