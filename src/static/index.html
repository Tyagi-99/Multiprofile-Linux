<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiprofile Linux — Operations Console</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1.8.0">
  <script>
    /* Pre-paint theme: data-theme on <html> before CSS loads so the window
       never flashes the wrong theme. Storage goes only through try/catch
       (pywebview private mode has no localStorage). */
    try {
      var __t = null;
      try { __t = window.localStorage.getItem("mp_theme"); } catch (e) { __t = null; }
      if (__t !== "light" && __t !== "dark") {
        __t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", __t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  </script>
  <link rel="stylesheet" href="app.css?v=1.8.0">
</head>
<body>
  <!-- ============ Login gate (shown when the API requires a token) ============ -->
  <div id="loginGate" class="login-gate" hidden>
    <div class="login-card">
      <div class="login-brand">
        <img src="/app_icon.png" width="44" height="44" alt="">
        <div>
          <strong>Multiprofile Linux</strong>
          <span>Operations Console</span>
        </div>
      </div>
      <p class="login-lede">This console needs an API access token to talk to the daemon.</p>
      <label class="field">
        <span class="field-label">API token</span>
        <input type="password" id="loginToken" placeholder="Paste your token…" autocomplete="off">
      </label>
      <p class="form-error" id="loginError" hidden></p>
      <div class="login-actions">
        <button class="btn btn-primary" id="loginSubmit">Connect</button>
        <button class="btn btn-ghost" id="loginSkip">Continue without token</button>
      </div>
      <p class="login-note">The token is stored only in this browser's local storage.</p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <!-- ============ Left sidebar ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <img src="/app_icon.png" width="32" height="32" alt="" class="brand-icon">
        <div class="brand-text">
          <strong>Multiprofile</strong>
          <span>Linux Console</span>
        </div>
      </div>
      <nav class="nav" id="mainNav" aria-label="Sections"></nav>
      <div class="sidebar-foot">
        <div class="health-pill" id="healthPill" title="Backend health">
          <span class="dot" id="healthDot"></span>
          <span id="healthText">Connecting…</span>
        </div>
        <button class="icon-btn sidebar-toggle" id="navCollapse" title="Collapse sidebar" aria-label="Collapse sidebar"></button>
        <div class="version" id="versionText">—</div>
      </div>
    </aside>

    <!-- ============ Main column ============ -->
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn nav-expand" id="navExpand" aria-label="Expand navigation" hidden>
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div class="page-head">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub" class="page-sub"></p>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <svg viewBox="0 0 16 16" width="14" height="14" class="search-icon" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input type="search" id="globalSearch" placeholder="Search profiles… ( / )" autocomplete="off" aria-label="Search profiles">
            <div class="search-results" id="searchResults" hidden></div>
          </div>
          <div class="theme-toggle" role="group" aria-label="Color theme">
            <button type="button" id="themeLight" aria-pressed="true" title="Light theme">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <span>Light</span>
            </button>
            <button type="button" id="themeDark" aria-pressed="false" title="Dark theme">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M13.2 10.2A6 6 0 0 1 5.8 2.8a6 6 0 1 0 7.4 7.4z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
              <span>Dark</span>
            </button>
          </div>
          <button class="btn btn-primary" id="btnNewProfile">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>New Profile</span>
          </button>
          <button class="icon-btn" id="btnAuth" title="API access token">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="5.5" cy="5.5" r="3.2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 8l4.8 4.8M11 11l1.8-1.8M13.5 13.5l1-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btnRefresh" title="Refresh current view">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v2.6h-2.6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <!-- ============ Slide-over drawer ============ -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Detail panel">
    <div class="drawer-head">
      <h2 id="drawerTitle">Details</h2>
      <button class="icon-btn" id="drawerClose" aria-label="Close panel">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- ============ Modal ============ -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">Dialog</h2>
        <button class="icon-btn" id="modalClose" aria-label="Close dialog">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot" hidden></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js?v=1.8.0"></script>
</body>
</html>
