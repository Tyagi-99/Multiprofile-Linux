<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiprofile — Operations Console</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app" class="app" aria-busy="true">
    <!-- Sidebar navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/app_icon.png" width="34" height="34" alt="" class="brand-icon">
        <div class="brand-text">
          <strong>Multiprofile</strong>
          <span>Operations Console</span>
        </div>
      </div>
      <nav class="nav" id="mainNav" aria-label="Primary"></nav>
      <div class="sidebar-foot">
        <div class="health-pill" id="healthPill" title="Backend health">
          <span class="dot" id="healthDot"></span>
          <span id="healthText">Connecting…</span>
        </div>
        <div class="version" id="versionText">—</div>
      </div>
    </aside>

    <!-- Main column -->
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
        <div class="page-head">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub" class="page-sub"></p>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <input type="search" id="globalSearch" placeholder="Search profiles… ( / )" autocomplete="off" aria-label="Search profiles">
            <div class="search-results" id="searchResults" hidden></div>
          </div>
          <button class="btn btn-primary" id="btnNewProfile">
            <span aria-hidden="true">＋</span> New Profile
          </button>
          <button class="icon-btn" id="btnAuth" title="API access token">🔑</button>
          <button class="icon-btn" id="btnRefresh" title="Refresh current view">⟳</button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Slide-over drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Detail panel">
    <div class="drawer-head">
      <h2 id="drawerTitle">Details</h2>
      <button class="icon-btn" id="drawerClose" aria-label="Close panel">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">Dialog</h2>
        <button class="icon-btn" id="modalClose" aria-label="Close dialog">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot" hidden></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
