[project]
name = "multiprofile-native"
version = "1.9.0"
description = "Native Linux Multiprofile manager (clean-room host for authorized UI/extension assets)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "websocket-client>=1.6.0",
]

[project.optional-dependencies]
ui = ["pywebview>=5.0"]
encrypted-backup = ["cryptography>=42.0.0"]
# OS keychain for the secrets master key (libsecret / DPAPI / Keychain).
# Optional: without it the key falls back to a 0600 file and the app
# says so loudly rather than pretending it is protected.
keychain = ["keyring>=25.0"]
all = ["pywebview>=5.0", "cryptography>=42.0.0", "keyring>=25.0"]

[project.scripts]
multiprofile = "multiprofile.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multiprofile = ["../static/*", "../extension/*"]

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that require outbound network access",
]


# ---------------------------------------------------------------------------
# Lint. Enforced in CI, so the selected set is one the tree actually passes.
#
# BLE001 (blind except) and S110 (try/except/pass) are **selected**, which is
# F11's resolution. They were deselected for most of this audit with a comment
# saying the ~140 existing sites were real but needed case-by-case judgement
# rather than a blanket silence. That judgement has now been made for every
# one of them, so the rules are on and each remaining site carries a `noqa`
# naming what is lost when it fires.
#
# The point is not the existing sites. It is that a **new** one cannot be
# added without a reviewer seeing it and writing down why it is safe. The
# policy the finding asks for is:
#
#   * a handler on the identity or security path records a structured fault
#     that reaches /api/health and the launch notes
#     (browser/identity_faults.py, storage/xdg.permission_faults)
#   * a handler whose failure costs the operator something reports it in the
#     value it returns -- a restore says how many cookies it restored, health
#     says the store was unreadable rather than reporting zero profiles
#   * anything else may still swallow, with a `noqa` saying what is lost
#
# "A launch path must never crash a browser" remains the reason these are
# broad. It was never a reason for them to be silent.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE001", "S110"]
ignore = [
  "E501",   # long lines: 25 remain, all in dense data literals
  "B008",   # call-in-default: Flask route decorators legitimately do this
]

[tool.ruff.lint.per-file-ignores]
# E402: tests set XDG env vars before importing the package.
#
# BLE001/S110: the policy above is about the product, where a swallowed
# failure reaches an operator who then believes something happened that did
# not. In a test harness the same construct means "this host has no Chrome,
# skip" or "tear the browser down, and do not let a teardown error mask the
# assertion that already failed". Nothing downstream is misled, so requiring
# a justification on each would be ceremony rather than a control -- and
# ceremony is how a policy stops being read.
"tests/*" = ["E402", "BLE001", "S110"]
