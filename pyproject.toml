[project]
name = "multiprofile-native"
version = "1.9.0"
description = "Native Linux Multiprofile manager (clean-room host for authorized UI/extension assets)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "websocket-client>=1.6.0",
]

[project.optional-dependencies]
ui = ["pywebview>=5.0"]
encrypted-backup = ["cryptography>=42.0.0"]
all = ["pywebview>=5.0", "cryptography>=42.0.0"]

[project.scripts]
multiprofile = "multiprofile.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multiprofile = ["../static/*", "../extension/*"]

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that require outbound network access",
]
