name: CI

# There was no CI at all. Four tests had been failing since the grid rewrite
# and nobody knew, because the habit was to run a five-file subset by hand.
# Everything below runs on every push and every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject. 3.12 is what the dev venv
        # uses. 3.13 is here because the .deb runs on whatever system python3
        # the distro ships, which on this machine is already ahead of the venv
        # -- the shipped runtime was never the tested one.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint
        # scripts/ and sdk/ too: the release tooling, the parity and
        # endurance harnesses and both SDKs are code an operator runs,
        # and they were outside the gate until 6 October 2026.
        run: uvx ruff check src/ tests/ scripts/ sdk/

      - name: Test
        env:
          PYTHONPATH: src
        # `-m "not network"` because this job installs no browser and no
        # display. The live tests launch a real headful Chromium, so here they
        # failed with "Chrome exited immediately with code 1" on every run,
        # including on main -- a red light nobody could act on.
        #
        # They are not skipped: the `live-browser` job below exists for them
        # and now has the display and session bus they actually need. This
        # matches what the coverage job has always done.
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q -m "not network"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Test with coverage
        env:
          PYTHONPATH: src
        run: |
          uvx --with pytest --with pytest-cov --with flask \
              --with websocket-client --with cryptography --with keyring \
              pytest tests/ -q -m "not network" --cov=multiprofile \
              --cov-report=term --cov-report=xml --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  live-browser:
    name: Live browser
    runs-on: ubuntu-latest
    # These launch real Chrome. They run in their own job, serially, because
    # several headless Chromes plus coverage instrumentation on a small
    # runner produce "Target crashed" -- a resource failure that looks like
    # a product failure. Kept out of the coverage job for the same reason.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install a display and a session bus
        # The product launches Chromium **headful** with --ozone-platform=x11,
        # because window tiling is a real feature and CDP can only set bounds
        # on a window that exists. Without an X server Chrome exits 1 before
        # doing anything, and without a session bus it prints
        #   Could not parse server address: Unknown address type
        # which is what every live test in CI was actually hitting.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb dbus dbus-x11 fonts-liberation \
            libasound2t64 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers || \
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb dbus dbus-x11 fonts-liberation \
            libasound2 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
      - name: Install the project
        run: uv sync --all-extras --dev
      - name: Isolation and live launch tests
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- \
              uv run pytest tests/ -q -rs -m network -p no:randomly
        # -rs prints the reason for every skip. Under plain -q a module-level
        # skip is a single `s` with no explanation, which is how a twelve-test
        # live suite went missing from a run without anything going red. A
        # suite that silently stops running is worse than one that fails.

  frontend:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

      - name: src/static must be built from the committed console source
        # The .deb ships src/static, not the frontend source, so a console
        # change committed without re-exporting silently ships the previous
        # UI. That is what this guards.
        #
        # It compares source hashes, not build outputs. The previous version
        # rebuilt here and diffed against the committed bundle -- two builds
        # from two Node versions, whose Next.js output is not byte-identical,
        # so it failed on every run including on main. A gate that is always
        # red gets ignored, which is worse than not having one.
        run: node scripts/check-static-fresh.mjs

  package:
    name: Build .deb
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the package
        run: bash build-deb.sh
      - name: Version markers must agree
        # dpkg installs the Version from packaging/debian/control while the
        # filename comes from build-deb.sh. If they drift, the package lies
        # about what it is.
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          def grab(path, pattern):
              text = pathlib.Path(path).read_text()
              m = re.search(pattern, text, re.M)
              return m.group(1) if m else None
          found = {
              "__init__.py": grab("src/multiprofile/__init__.py", r'__version__\s*=\s*"([^"]+)"'),
              "pyproject.toml": grab("pyproject.toml", r'^version\s*=\s*"([^"]+)"'),
              "build-deb.sh": grab("build-deb.sh", r'^VERSION=(\S+)'),
              "debian/control": grab("packaging/debian/control", r'^Version:\s*(\S+)'),
          }
          print(found)
          if len(set(found.values())) != 1 or None in found.values():
              sys.exit("version markers disagree")
          EOF
      - name: The fallback builder must agree with dpkg-deb
        # build-deb.sh prefers dpkg-deb where it exists and falls back to
        # scripts/build_deb.py where it does not -- which is the development
        # machine. If the two ever disagree, the package the developer tests
        # is not the package CI ships, so they are compared on every build.
        run: |
          set -euo pipefail
          VERSION=$(grep -oP '^VERSION=\K\S+' build-deb.sh)
          ARCH=$(awk -F': ' '/^Architecture:/{print $2}' packaging/debian/control)
          STAGE="dist/multiprofile-native_${VERSION}_${ARCH}"
          DEB="dist/multiprofile-native_${VERSION}_${ARCH}.deb"
          python3 scripts/build_deb.py "$STAGE" /tmp/py.deb
          dpkg-deb -I /tmp/py.deb > /dev/null
          dpkg-deb -c /tmp/py.deb | awk '{print $6}' | sort > /tmp/py.list
          dpkg-deb -c "$DEB"      | awk '{print $6}' | sort > /tmp/dpkg.list
          diff /tmp/py.list /tmp/dpkg.list
          echo "the fallback builder agrees with dpkg-deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release-lifecycle:
    name: Signed release lifecycle
    runs-on: ubuntu-latest
    needs: [package]
    # F12. The finding was that the packaging path could not be exercised on
    # the development machine and so shipped unverified. This runs the whole
    # of it in a clean Debian container on every push: build two versions,
    # sign a repository with a key generated for this run and discarded with
    # the container, publish deltas, install, update across the delta, verify
    # the signature chain, prove a tampered channel is refused, roll back,
    # and confirm the rolled-back install still serves its API. Then the same
    # channel again through apt, so the sources line docs/UPDATES.md hands
    # operators is verified by running it rather than by reading the format.
    #
    # No production secret is involved. The signing key is disposable by
    # construction: it is generated inside the container and never leaves it.
    container:
      image: debian:bookworm-slim
    steps:
      - name: Install the tools the lifecycle needs
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates python3 python3-flask python3-websocket \
            gnupg gpgv zstd dpkg-dev binutils file curl
      - uses: actions/checkout@v4
      - name: Build, sign, publish, install, update, verify, roll back
        run: bash scripts/release-lifecycle-inner.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory: a new CVE published upstream must not turn main red on its
    # own, but it must be visible. Treat a failure here as a ticket.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python dependencies
        run: uvx pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Split, because the two questions have different answers and only one
      # of them is a release decision.
      #
      # What could SHIP is the blocking one. The .deb ships `src/static` --
      # the built static export -- and no node_modules at all, so a
      # production-tree advisory still only affects a build host; but that is
      # the closest thing to shipped exposure this project has, and it is
      # currently clean, so it can be a real gate rather than noise.
      - name: Console dependencies that could reach a build artefact
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      # Dev-only advisories are reported and do not gate. The standing example
      # is braces <-> micromatch <-> fast-glob <-> @next/eslint-plugin-next
      # <-> eslint-config-next: a lint-time stack-exhaustion DoS whose only
      # offered fix is downgrading eslint-config-next from 16.3.6 to 14.2.35,
      # a semver-major move away from the Next 16 this console is built with.
      # Taking that fix would mismatch the framework to silence a tool that
      # never runs outside CI. See docs/11_EXTENSIONS.md section 9.
      - name: Console dev dependencies (reported, not a gate)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
